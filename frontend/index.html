<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Riesgos ISI604 · Matriz y conciliación ISO/IEC 27001</title>
<style>
:root{
  --navy:#0f2742; --navy2:#173a5e; --ink:#1d2733; --mut:#5d6b7a; --line:#d9e0e7; --bg:#f4f6f8; --card:#fff;
  --acc:#1f6fb2; --accbg:#e8f1fa;
  --bajo:#2e9e5b; --medio:#e3b505; --alto:#ec7a1c; --critico:#c62f2f;
  --ok:#2e9e5b; --warn:#d48a00; --bad:#c62f2f;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px;letter-spacing:.2px}
header .brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
header .search{margin-left:auto;position:relative}
header .search input{width:320px;padding:8px 12px;border-radius:6px;border:0;font-size:14px}
#searchRes{position:absolute;right:0;top:40px;width:460px;max-height:420px;overflow:auto;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;display:none}
#searchRes div.it{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#searchRes div.it:hover{background:var(--accbg)}
#searchRes .tp{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
nav{background:var(--navy2);display:flex;gap:2px;padding:0 16px;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfdbe8;padding:11px 16px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#5fb0f0;font-weight:600}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
h2{font-size:19px;margin:0 0 12px;color:var(--navy)} h3{font-size:15px;margin:0 0 8px;color:var(--navy)}
.mut{color:var(--mut)} .small{font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .gside{grid-template-columns:300px 1fr}
@media(max-width:1000px){.g2,.g3,.gside{grid-template-columns:1fr} header .search input{width:220px}}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 13px;cursor:pointer;font-size:13px}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=date],textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;background:#fff}
textarea{width:100%;min-height:54px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px;font-weight:600}
label.f + input,label.f + select{width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eef2f6;font-size:12px;color:var(--navy);position:sticky;top:0}
tr.click:hover{background:#f3f8fd;cursor:pointer}
.chip{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:12px;padding:1px 9px;margin:2px 3px 2px 0;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.cl{background:#efe9f8;color:#5b3c99}
.chip.new{background:#fff3d6;color:#8a5a00}
.chip .x{margin-left:5px;font-weight:700}
.lvl{display:inline-block;border-radius:4px;padding:1px 8px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.lvl.Bajo{background:var(--bajo)} .lvl.Medio{background:var(--medio);color:#3b2f00} .lvl.Alto{background:var(--alto)} .lvl.Crítico{background:var(--critico)} .lvl.Sin{background:#9aa6b2}
.st{font-weight:600;font-size:12px;padding:2px 8px;border-radius:4px}
.st.cumple{background:#e3f4ea;color:var(--ok)} .st.alerta{background:#fff1d6;color:var(--warn)} .st.falta{background:#fbe3e3;color:var(--bad)}
.tabs2{display:flex;gap:6px;margin-bottom:12px}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 13px;cursor:pointer}
.tabs2 button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list .it{padding:9px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.list .it:hover{background:#f3f8fd}
.list .it.on{background:var(--accbg);border-color:#b8d5ee}
.concept{border-left:3px solid var(--acc);padding:4px 10px;margin:6px 0;background:#fafcfe}
.box{background:#f7f9fb;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:10px 0}
.heat{display:grid;grid-template-columns:70px repeat(5,1fr);gap:3px;font-size:12px}
.heat .c{min-height:58px;border-radius:4px;padding:4px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;position:relative}
.heat .c .n{position:absolute;right:4px;bottom:2px;font-size:10px;opacity:.6}
.heat .c.over{outline:2px dashed rgba(0,0,0,.35);outline-offset:-3px}
.heat .ax{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:11px}
.heat .tag{background:rgba(255,255,255,.92);border-radius:3px;padding:0 4px;font-weight:600;font-size:11px;cursor:pointer}
.kpi{display:flex;gap:12px;flex-wrap:wrap}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:130px}
.kpi b{display:block;font-size:22px;color:var(--navy)}
#drawer{position:fixed;top:0;right:-560px;width:540px;max-width:100%;height:100%;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.2);transition:right .2s;z-index:60;overflow:auto;padding:20px}
#drawer.open{right:0}
#modal{position:fixed;inset:0;background:rgba(15,39,66,.45);display:none;z-index:70;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px}
#modal .in{background:#fff;border-radius:10px;width:980px;max-width:100%;padding:20px 22px}
.closeX{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#eef2f6;font-size:12px;margin-right:4px}
.gauge{font-size:40px;font-weight:700;color:var(--navy)}
.bar{height:10px;background:#e7ecf1;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:6px;z-index:90;display:none}
.scroll{max-height:560px;overflow:auto}
.ae{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.ae b{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="brand">Gestión de Riesgos · ISI604<small>Escuela de Ingeniería, Energía y Tecnología · Matriz de riesgos conciliada con ISO/IEC 27001:2022</small></div>
  <div class="search"><input id="q" type="text" placeholder="Buscar contenido, cláusula o control (ej. respaldo, 6.1.3, nube)"><div id="searchRes"></div></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="drawer"></div>
<div id="modal"><div class="in" id="modalIn"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = location.protocol === "file:" ? "http://localhost:8000" : "";
const S = { tab: "inicio", pid: null, esc: null, unidades: [], clausulas: [], controles: [], temas: [], asig: null,
            contenido: null, isoTab: "clausulas", ctlTema: "", ctlQ: "", heat: "inherente", segR: null, soaF: "todos" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path, opt = {}) {
  const r = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opt,
    body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (!r.ok) { const e = await r.json().catch(() => ({})); toast(e.detail || "Error " + r.status); throw new Error(e.detail); }
  return r.json();
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 2600); }
const lvl = n => `<span class="lvl ${n && n.valor ? n.nombre : "Sin"}">${n && n.valor ? n.valor + " · " + n.nombre : "Sin evaluar"}</span>`;
const nivelDe = (p, i) => { if (!p || !i) return null; const v = p * i; const n = S.esc.niveles.find(x => v >= x.min && v <= x.max); return { valor: v, nombre: n ? n.nombre : "Crítico" }; };
const chipC = id => { const c = S.controles.find(x => x.id === id); return `<span class="chip ${c && c.nuevo2022 ? "new" : ""}" onclick="verControl('${id}')" title="${esc(c ? c.titulo : "")}">A.${id}</span>`; };
const chipCl = id => `<span class="chip cl" onclick="verClausula('${id}')">Cl. ${id}</span>`;
const colorNivel = v => v >= 15 ? "var(--critico)" : v >= 10 ? "var(--alto)" : v >= 5 ? "var(--medio)" : "var(--bajo)";

const TABS = [["inicio","Asignatura"],["contenidos","Contenidos"],["iso","ISO/IEC 27001"],["matriz","Matriz de riesgos"],
              ["seguimiento","Seguimiento"],["soa","Declaración de aplicabilidad"],["conciliacion","Conciliación ISO 27001"]];
function renderNav() {
  $("#nav").innerHTML = TABS.map(([k, t]) => `<button class="${S.tab === k ? "on" : ""}" onclick="go('${k}')">${t}</button>`).join("");
}
function go(t) { S.tab = t; renderNav(); render(); window.scrollTo(0, 0); }

async function init() {
  [S.esc, S.unidades, S.clausulas, S.controles, S.temas, S.asig] = await Promise.all([
    api("/api/escalas"), api("/api/unidades"), api("/api/iso/clausulas"), api("/api/iso/controles"), api("/api/iso/temas"), api("/api/asignatura")]);
  const ps = await api("/api/proyectos"); S.pid = ps.length ? ps[0].id : null;
  S.contenido = S.unidades[0].contenidos[0].id;
  renderNav(); render();
}

// --------------------------------------------------------------- selector de proyecto
async function selectorProyecto() {
  const ps = await api("/api/proyectos");
  if (S.pid && !ps.find(p => p.id === S.pid)) S.pid = ps.length ? ps[0].id : null;
  const p = ps.find(x => x.id === S.pid);
  return { p, html: `<div class="card row" style="justify-content:space-between">
    <div class="row"><b>Proyecto:</b>
      <select onchange="S.pid=+this.value;render()">${ps.map(x => `<option value="${x.id}" ${x.id === S.pid ? "selected" : ""}>${esc(x.nombre)} (${x.n_riesgos})</option>`).join("")}</select>
      ${p ? `<span class="pill">Apetito: nivel ${p.apetito}</span><span class="pill">Revisión cada ${p.frecuencia_revision_dias} días</span>` : ""}
    </div>
    <div class="row"><button class="btn sec" onclick="formProyecto()">Nuevo proyecto</button>${p ? `<button class="btn sec" onclick="formProyecto(${p.id})">Editar proyecto</button>` : ""}</div></div>` };
}
async function formProyecto(id) {
  const p = id ? (await api("/api/proyectos")).find(x => x.id === id) : { nombre: "", descripcion: "", equipo: "", apetito: 9, frecuencia_revision_dias: 14 };
  openModal(`<button class="closeX" onclick="closeModal()">×</button><h2>${id ? "Editar" : "Nuevo"} proyecto</h2>
    <p class="mut small">El apetito de riesgo es el criterio de aceptación exigido por la cláusula 6.1.2 a). La frecuencia de revisión responde a la cláusula 8.2.</p>
    <label class="f">Nombre del proyecto</label><input type="text" id="pN" value="${esc(p.nombre)}">
    <label class="f">Descripción y objetivos</label><textarea id="pD">${esc(p.descripcion)}</textarea>
    <label class="f">Equipo de gestión de riesgo (roles y nombres)</label><textarea id="pE">${esc(p.equipo)}</textarea>
    <div class="grid g2"><div><label class="f">Apetito de riesgo (nivel máximo aceptable, 1 a 25)</label><input type="number" min="1" max="25" id="pA" value="${p.apetito}"></div>
    <div><label class="f">Frecuencia de revisión (días)</label><input type="number" min="1" id="pF" value="${p.frecuencia_revision_dias}"></div></div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <div>${id ? `<button class="btn danger" onclick="borrarProyecto(${id})">Eliminar proyecto</button>` : ""}</div>
      <button class="btn" onclick="guardarProyecto(${id || 0})">Guardar</button></div>`);
}
async function guardarProyecto(id) {
  const b = { nombre: $("#pN").value.trim(), descripcion: $("#pD").value, equipo: $("#pE").value, apetito: +$("#pA").value, frecuencia_revision_dias: +$("#pF").value };
  if (!b.nombre) return toast("Ingrese un nombre");
  if (id) await api("/api/proyectos/" + id, { method: "PUT", body: b }); else S.pid = (await api("/api/proyectos", { method: "POST", body: b })).id;
  closeModal(); toast("Proyecto guardado"); render();
}
async function borrarProyecto(id) {
  if (!confirm("¿Eliminar el proyecto con todos sus riesgos, revisiones y su declaración de aplicabilidad?")) return;
  await api("/api/proyectos/" + id, { method: "DELETE" }); S.pid = null; closeModal(); render();
}

// ------------------------------------------------------------------- vistas
async function render() {
  const m = $("#main");
  const v = { inicio: vInicio, contenidos: vContenidos, iso: vIso, matriz: vMatriz, seguimiento: vSeguimiento, soa: vSoa, conciliacion: vConciliacion }[S.tab];
  m.innerHTML = await v();
}

function vInicio() {
  const a = S.asig;
  return `<div class="card"><h2>${esc(a.codigo)} ${esc(a.nombre)} <span class="pill">${a.horas} horas</span></h2>
    <p><b>Unidad de competencia:</b> ${esc(a.competencia)}</p>
    <h3 style="margin-top:14px">Aprendizajes esperados</h3>
    <div class="grid g3">${a.aprendizajes.map(x => `<div class="ae"><b>${x.id}</b> ${esc(x.texto)}</div>`).join("")}</div></div>
    <div class="grid g2">
      <div class="card"><h3>Unidades y contenidos</h3>${S.unidades.map(u => `<p><b>${esc(u.nombre)}</b> <span class="mut small">(${u.aprendizajes.join(", ")})</span></p>
        <div>${u.contenidos.map(c => `<span class="chip" onclick="S.contenido='${c.id}';go('contenidos')">${esc(c.titulo)}</span>`).join("")}</div>`).join("")}</div>
      <div class="card"><h3>Cómo usar esta aplicación</h3>
        <ol style="margin:0;padding-left:18px">
          <li><b>Contenidos:</b> estudie cada tema con sus conceptos, ejemplo aplicado y las cláusulas y controles relacionados.</li>
          <li><b>ISO/IEC 27001:</b> consulte las cláusulas 4 a 10 y los 93 controles del Anexo A; vea qué riesgos usan cada control.</li>
          <li><b>Matriz de riesgos:</b> cree el proyecto de su grupo, defina el apetito y registre los riesgos (AE1 y AE2).</li>
          <li><b>Seguimiento:</b> registre revisiones, desviaciones y acciones; observe la tendencia de cada riesgo (AE3).</li>
          <li><b>Declaración de aplicabilidad:</b> decida y justifique cada control del Anexo A (6.1.3 d).</li>
          <li><b>Conciliación:</b> verifique qué requisitos de la norma cumple su matriz y qué falta corregir.</li>
        </ol>
        <p class="mut small" style="margin-top:10px">El proyecto DEMO contiene errores intencionales para que la conciliación los detecte. Úselo como caso de análisis antes de construir el propio.</p></div>
    </div>`;
}

function vContenidos() {
  let cur, uni;
  S.unidades.forEach(u => u.contenidos.forEach(c => { if (c.id === S.contenido) { cur = c; uni = u; } }));
  const lista = S.unidades.map(u => `<h3 style="margin-top:8px">${esc(u.nombre)}</h3><div class="list">${u.contenidos.map(c =>
    `<div class="it ${c.id === S.contenido ? "on" : ""}" onclick="S.contenido='${c.id}';render()">${esc(c.titulo)}</div>`).join("")}</div>`).join("");
  return `<div class="grid gside"><div class="card">${lista}</div>
    <div class="card"><div class="mut small">${esc(uni.nombre)} · ${uni.aprendizajes.join(", ")}</div><h2>${esc(cur.titulo)}</h2>
      <p>${esc(cur.resumen)}</p>
      <h3>Conceptos clave</h3>${cur.conceptos.map(k => `<div class="concept"><b>${esc(k.termino)}:</b> ${esc(k.definicion)}</div>`).join("")}
      ${cur.tecnicas ? `<h3 style="margin-top:12px">Técnicas</h3><div>${cur.tecnicas.map(t => `<span class="pill">${esc(t)}</span>`).join(" ")}</div>` : ""}
      <div class="box"><b>Aplicación en proyectos informáticos.</b> ${esc(cur.en_proyectos)}</div>
      <div class="box"><b>Ejemplo.</b> ${esc(cur.ejemplo)}</div>
      <div class="grid g2"><div><h3>Cláusulas ISO/IEC 27001</h3>${cur.clausulas.map(chipCl).join("")}</div>
      <div><h3>Controles del Anexo A</h3>${cur.controles.map(chipC).join("")}</div></div>
      <h3 style="margin-top:14px">Preguntas de análisis</h3><ol>${cur.preguntas.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div></div>`;
}

function vIso() {
  const t2 = `<div class="tabs2"><button class="${S.isoTab === "clausulas" ? "on" : ""}" onclick="S.isoTab='clausulas';render()">Cláusulas 4 a 10 (requisitos)</button>
    <button class="${S.isoTab === "anexo" ? "on" : ""}" onclick="S.isoTab='anexo';render()">Anexo A (93 controles)</button>
    <button class="${S.isoTab === "flujo" ? "on" : ""}" onclick="S.isoTab='flujo';render()">De la matriz a la norma</button></div>`;
  if (S.isoTab === "clausulas") {
    const grupos = [...new Set(S.clausulas.map(c => c.grupo))];
    return t2 + grupos.map(g => { const cs = S.clausulas.filter(c => c.grupo === g);
      return `<div class="card"><h3>${esc(g)} <span class="pill">${cs[0].pdca}</span></h3><table><tr><th style="width:70px">Cláusula</th><th>Requisito</th><th>Qué exige</th><th>Evidencia en la matriz</th></tr>
      ${cs.map(c => `<tr class="click" onclick="verClausula('${c.id}')"><td><b>${c.id}</b></td><td>${esc(c.titulo)}</td><td>${esc(c.explicacion)}</td><td class="mut">${esc(c.en_matriz)}</td></tr>`).join("")}</table></div>`; }).join("");
  }
  if (S.isoTab === "flujo") {
    const pasos = [["Contexto e incertidumbre", "4.1, 4.2", "Situación de incertidumbre, categoría"], ["Criterios y método", "6.1.2 a) b)", "Escalas, apetito del proyecto"],
      ["Identificación", "6.1.2 c)", "Activo, amenaza, vulnerabilidad, CID, dueño"], ["Análisis", "6.1.2 d)", "Probabilidad, impacto, nivel inherente"],
      ["Evaluación", "6.1.2 e)", "Comparación con el apetito, prioridad"], ["Tratamiento", "6.1.3 a) b) c)", "Opción, plan, controles del Anexo A"],
      ["Aplicabilidad", "6.1.3 d)", "Declaración de aplicabilidad"], ["Aceptación del residual", "6.1.3 f)", "Nivel residual, aprobación del dueño"],
      ["Operación", "8.2, 8.3", "Fechas de revisión, estado de implementación"], ["Seguimiento", "9.1, 9.3", "Registro de revisiones, tendencias"],
      ["Mejora", "10.2", "Desviaciones y acciones correctivas"]];
    return t2 + `<div class="card"><h3>Correspondencia entre cada columna de la matriz y la cláusula que evidencia</h3>
      <table><tr><th>#</th><th>Etapa del proceso</th><th>Cláusula</th><th>Campo de la matriz o registro</th></tr>
      ${pasos.map((p, i) => `<tr><td>${i + 1}</td><td><b>${p[0]}</b></td><td>${p[1].split(", ").map(x => chipCl(x.split(" ")[0])).join("")} <span class="mut small">${esc(p[1])}</span></td><td>${esc(p[2])}</td></tr>`).join("")}</table>
      <p class="mut small" style="margin-top:10px">Regla de oro: un control del Anexo A se declara aplicable porque un riesgo lo requiere (o por requisito legal o contractual), y se excluye solo con justificación. La SoA es la bisagra entre la matriz y la norma.</p></div>`;
  }
  const lista = S.controles.filter(c => (!S.ctlTema || c.id.startsWith(S.ctlTema + ".")) &&
    (!S.ctlQ || (c.id + " " + c.titulo + " " + c.descripcion + " " + c.claves.join(" ")).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(S.ctlQ.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""))));
  return t2 + `<div class="card"><div class="row" style="margin-bottom:10px">
      <input type="text" id="ctlQ" placeholder="Filtrar por palabra (ej. contraseña, nube, respaldo)" value="${esc(S.ctlQ)}" oninput="S.ctlQ=this.value;clearTimeout(window._ct);window._ct=setTimeout(()=>{render().then(()=>{const e=$('#ctlQ');e.focus();e.setSelectionRange(e.value.length,e.value.length)})},250)" style="width:340px">

function heatmap(celdas, ap) {
  let h = `<div class="heat"><div></div>${S.esc.impacto.map(i => `<div class="ax">${i.valor}<br>${i.nombre}</div>`).join("")}`;
  for (let p = 5; p >= 1; p--) {
    h += `<div class="ax">${p}<br>${S.esc.probabilidad[p - 1].nombre}</div>`;
    for (let i = 1; i <= 5; i++) {
      const v = p * i, cods = celdas[`${p}-${i}`] || [];
      h += `<div class="c ${v > ap ? "over" : ""}" style="background:${colorNivel(v)}">${cods.map(c => `<span class="tag" onclick="abrirPorCodigo('${c}')">${c}</span>`).join("")}<span class="n">${v}</span></div>`;
    }
  }
  return h + `</div><div class="mut small" style="text-align:center;margin-top:4px">Impacto →  ·  ↑ Probabilidad</div>`;
}

     <div style="margin-top:6px">${r.controles.map(chipC).join("")}</div>

     ${revs.length ? `<table><tr><th>Fecha</th><th>Revisor</th><th>Nivel</th><th>Estado</th><th>Desviación</th><th>Acción correctiva</th><th>Comentario</th><th></th></tr>

function grafico(serie, ap, resid) {
  const W = 760, H = 210, L = 34, B = 26, T = 10, R = 10;
  const n = serie.length, x = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), y = v => T + (H - T - B) * (1 - v / 25);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  [5, 10, 15, 20, 25].forEach(v => s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e5eaef"/><text x="${L - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#5d6b7a">${v}</text>`);
  s += `<line x1="${L}" x2="${W - R}" y1="${y(ap)}" y2="${y(ap)}" stroke="#c62f2f" stroke-dasharray="5 4"/><text x="${W - R}" y="${y(ap) - 4}" font-size="10" text-anchor="end" fill="#c62f2f">Apetito ${ap}</text>`;
  if (resid) s += `<line x1="${L}" x2="${W - R}" y1="${y(resid)}" y2="${y(resid)}" stroke="#2e9e5b" stroke-dasharray="2 4"/><text x="${L + 4}" y="${y(resid) - 4}" font-size="10" fill="#2e9e5b">Residual objetivo ${resid}</text>`;
  s += `<polyline fill="none" stroke="#1f6fb2" stroke-width="2.5" points="${serie.map((p, i) => x(i) + "," + y(p.v)).join(" ")}"/>`;
  serie.forEach((p, i) => { const d = p.t && p.t !== "Ninguna" && p.t !== "Identificación";
    s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${d ? 6 : 4.5}" fill="${d ? "#ec7a1c" : colorNivel(p.v)}" stroke="#fff" stroke-width="1.5"><title>${esc(p.f)} · nivel ${p.v}${d ? " · desviación: " + esc(p.t) : ""}</title></circle>
      <text x="${x(i)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#5d6b7a">${esc((p.f || "").slice(5))}</text><text x="${x(i)}" y="${y(p.v) - 9}" font-size="10" text-anchor="middle" fill="#1d2733">${p.v}</text>`; });
  return s + `</svg><div class="small mut">Puntos naranjos: revisiones con desviación registrada.</div>`;
}
async function guardarRev() {
  const b = { fecha: $("#vF").value, revisor: $("#vR").value, estado: $("#vE").value, probabilidad: +$("#vP").value, impacto: +$("#vI").value,
    desviacion_tipo: $("#vD").value, desviacion_detalle: $("#vDD").value, accion: $("#vA").value, comentario: $("#vC").value };
  if (!b.probabilidad || !b.impacto) return toast("Indique probabilidad e impacto actuales");
  if (b.desviacion_tipo !== "Ninguna" && !b.accion) toast("Registrada. Recuerde: una desviación sin acción incumple 10.2");
  await api(`/api/riesgos/${S.segR}/revisiones`, { method: "POST", body: b }); render();
}
async function borrarRev(id) { if (!confirm("¿Eliminar esta revisión?")) return; await api("/api/revisiones/" + id, { method: "DELETE" }); render(); }

// ---------------------------------------------------------------------- SoA
async function vSoa() {
  const sel = await selectorProyecto();
  if (!sel.p) return sel.html;
  const sa = await api(`/api/proyectos/${S.pid}/soa`);
  S._soa = sa;
  const f = { todos: () => true, aplicables: s => s.aplicable === true, excluidos: s => s.aplicable === false, pendientes: s => s.aplicable === null, riesgo: s => s.riesgos.length }[S.soaF];
  const cnt = k => sa.filter({ aplicables: s => s.aplicable === true, excluidos: s => s.aplicable === false, pendientes: s => s.aplicable === null, riesgo: s => s.riesgos.length, todos: () => true }[k]).length;
  return sel.html + `<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Declaración de Aplicabilidad ${chipCl("6.1.3")}</h2>
     <p class="mut small" style="margin:4px 0 0">Los controles usados por la matriz quedan aplicables automáticamente. Todo control excluido requiere justificación. Los cambios se guardan al modificar cada campo.</p></div>
     <a class="btn sec" href="${API}/api/proyectos/${S.pid}/export/soa.csv">Exportar SoA (CSV)</a></div>
   <div class="tabs2" style="margin-top:12px">${[["todos", "Todos"], ["aplicables", "Aplicables"], ["excluidos", "Excluidos"], ["pendientes", "Pendientes"], ["riesgo", "Requeridos por riesgos"]].map(([k, t]) =>
     `<button class="${S.soaF === k ? "on" : ""}" onclick="S.soaF='${k}';render()">${t} (${cnt(k)})</button>`).join("")}</div>
   <div class="scroll" style="max-height:640px"><table><tr><th style="width:55px">Control</th><th>Título</th><th style="width:120px">Aplicable</th><th>Justificación</th><th style="width:120px">Riesgos</th><th style="width:150px">Implementación</th></tr>
   ${sa.filter(f).map(s => { const err = (s.aplicable === false && !s.justificacion_registrada) || (s.aplicable === false && s.riesgos.length);
     return `<tr style="${err ? "background:#fdf0f0" : ""}"><td><span class="chip" onclick="verControl('${s.id}')">${s.id}</span></td><td>${esc(s.titulo)}<div class="small mut">${esc(s.origen)}</div></td>
     <td><select onchange="guardarSoa('${s.id}',this.closest('tr'))" class="sA"><option value="" ${s.aplicable === null ? "selected" : ""}>Pendiente</option><option value="1" ${s.aplicable === true ? "selected" : ""}>Sí</option><option value="0" ${s.aplicable === false ? "selected" : ""}>No</option></select></td>
     <td><input type="text" class="sJ" style="width:100%" value="${esc(s.justificacion_registrada)}" placeholder="${esc(s.justificacion || (s.aplicable === false ? "Obligatoria si se excluye" : ""))}" onchange="guardarSoa('${s.id}',this.closest('tr'))">
       ${s.aplicable === false && s.riesgos.length ? `<div class="small" style="color:var(--bad)">Inconsistencia: lo requieren ${s.riesgos.join(", ")}</div>` : ""}</td>
     <td>${s.riesgos.map(x => `<span class="pill">${x}</span>`).join("")}</td>
     <td><select class="sE" onchange="guardarSoa('${s.id}',this.closest('tr'))">${S.esc.estados_implementacion.map(e => `<option ${e === s.estado_implementacion ? "selected" : ""}>${e}</option>`).join("")}</select></td></tr>`; }).join("")}</table></div></div>`;
}
async function guardarSoa(id, tr) {
  const a = tr.querySelector(".sA").value;
  await api(`/api/proyectos/${S.pid}/soa/${id}`, { method: "PUT", body: { aplicable: a === "" ? null : a === "1", justificacion: tr.querySelector(".sJ").value, estado_implementacion: tr.querySelector(".sE").value } });
  toast("Control " + id + " actualizado"); render();
}

// ------------------------------------------------------------- conciliación
async function vConciliacion() {
  const sel = await selectorProyecto();
  if (!sel.p) return sel.html;
  const c = await api(`/api/proyectos/${S.pid}/conciliacion`);
  const col = c.porcentaje >= 80 ? "var(--ok)" : c.porcentaje >= 50 ? "var(--warn)" : "var(--bad)";
  return sel.html + `<div class="grid g2" style="grid-template-columns:320px 1fr"><div class="card"><h3>Grado de conformidad de la matriz</h3>
     <div class="gauge" style="color:${col}">${c.porcentaje}%</div><div class="bar"><i style="width:${c.porcentaje}%;background:${col}"></i></div>
     <p><span class="st cumple">${c.resumen.cumple} cumple</span> <span class="st alerta">${c.resumen.alerta} alerta</span> <span class="st falta">${c.resumen.falta} falta</span></p>
     <p class="mut small">Cumple vale 1, alerta 0,5 y falta 0. Es un indicador formativo del estado documental del proceso, no una auditoría de certificación.</p>
     <p class="small"><b>Uso sugerido:</b> cada grupo corrige su matriz hasta eliminar los "falta" y presenta las "alertas" justificadas en la revisión por la dirección (9.3).</p></div>
   <div class="card"><h3>Requisitos verificados</h3><table><tr><th style="width:90px">Cláusula</th><th>Requisito</th><th style="width:80px">Estado</th><th>Hallazgo</th></tr>
   ${c.checks.map(k => `<tr><td>${k.clausula.startsWith("A.") ? `<span class="chip" onclick="verControl('${k.clausula.slice(2)}')">${esc(k.clausula)}</span>` : `<span class="chip cl" onclick="verClausula('${k.clausula.split(" ")[0]}')">${esc(k.clausula)}</span>`}</td><td>${esc(k.requisito)}</td><td><span class="st ${k.estado}">${k.estado}</span></td>
     <td>${esc(k.detalle)}${k.items.length ? `<div style="margin-top:4px">${k.items.map(i => `<span class="pill">${esc(i)}</span>`).join("")}</div>` : ""}</td></tr>`).join("")}</table></div></div>`;
}

// ------------------------------------------------------------------ búsqueda
$("#q").addEventListener("input", e => {
  clearTimeout(window._qt); const q = e.target.value.trim();
  window._qt = setTimeout(async () => {
    const box = $("#searchRes"); if (q.length < 2) { box.style.display = "none"; return; }
    const res = await api("/api/buscar?q=" + encodeURIComponent(q));
    box.innerHTML = res.length ? res.map(r => `<div class="it" data-t="${r.tipo}" data-id="${r.id}"><div class="tp">${r.tipo}</div><b>${esc(r.id)}</b> ${esc(r.titulo)}<div class="small mut">${esc(r.detalle).slice(0, 110)}</div></div>`).join("") : '<div class="it mut">Sin resultados</div>';
    box.style.display = "block";
    box.querySelectorAll(".it[data-id]").forEach(el => el.onclick = () => { box.style.display = "none"; const t = el.dataset.t, id = el.dataset.id;
      if (t === "Contenido") { S.contenido = id; go("contenidos"); } else if (t === "Cláusula") verClausula(id); else verControl(id); });
  }, 220);
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#searchRes").style.display = "none"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeDrawer(); } });
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

init().catch(e => { $("#main").innerHTML = `<div class="card"><h2>No se pudo conectar con el backend</h2><p>Inicie el servidor con <code>uvicorn app:app --port 8000</code> dentro de la carpeta <code>backend</code> y abra <code>http://localhost:8000</code>.</p></div>`; });
</script>
